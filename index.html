<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>

.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
.hud b{display:block;font-size:34px;line-height:1;font-weight:800;letter-spacing:-.5px}
.hud small{font-size:13px;opacity:.8}
.hud .r{text-align:right}
#combo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 78px);left:0;right:0;text-align:center;font-size:26px;font-weight:800;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;min-height:32px}

.ctl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:12px}
.btn{width:82px;height:82px;border-radius:22px;background:var(--panel);border:2px solid rgba(255,247,236,.35);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.btn.on{background:var(--hot);border-color:var(--gold);transform:scale(.94)}
#L{left:16px}#R{right:16px}
#hb{width:104px;height:104px;border-radius:50%;font-size:17px}
#start{z-index:10;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(32,18,44,.72);text-align:center;padding:24px}

#zr{left:auto;right:0}
.zone.on{opacity:.8;background:linear-gradient(to top,rgba(255,107,74,.25),transparent 45%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,rgba(30,10,50,.45))}
.hud,#combo{display:none}
#spd{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 52%,transparent 0 6deg,rgba(255,244,230,.16) 6deg 7deg);-webkit-mask-image:radial-gradient(circle at 50% 52%,transparent 38%,#000 78%);mask-image:radial-gradient(circle at 50% 52%,transparent 38%,#000 78%)}
#start h1{font-size:46px;margin:0 0 6px;font-weight:900;transform:skewX(-8deg)}
#start p{max-width:300px;line-height:1.45;margin:0 0 22px;opacity:.9}
#go{background:var(--hot);color:#fff;font:800 22px "Trebuchet MS",sans-serif;border:0;border-radius:16px;padding:16px 40px}
</style>
</head>

</div>

  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{fn(false);el.classList.remove('on')}));
}
let lastS=0;bind('zl',v=>{TL=v;if(v&&!TR)lastS=-1});bind('zr',v=>{TR=v;if(v&&!TL)lastS=1});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
$('go').addEventListener('click',()=>{$('start').style.display='none';running=true;});
document.addEventListener('contextmenu',e=>e.preventDefault());

const combo=$('combo');
let msgT=0;
function crash(){
  if(cur>0||mult>1){combo.textContent='Chain lost';combo.className='bad';msgT=1;}
  cur=0;dT=0;mult=1;gap=0;hit=.5;
}
function bankIt(){
  bank+=Math.round(cur);cur=0;dT=0;mult=1;
  if(bank>best){best=bank;$('bs').textContent=best;try{localStorage.setItem('lpd_best',best)}catch(e){}}
}

function step(dt){
  const L_=TL||keys.ArrowLeft||keys.KeyA,R_=TR||keys.ArrowRight||keys.KeyD;const tgt=L_&&R_?lastS:(R_?1:0)-(L_?1:0);
  steer+=(tgt-steer)*Math.min(1,dt*7);
  const hb=(TL&&TR)||keys.Space;
  const sf=Math.sin(h),cf=Math.cos(h);
  let vf=vx*sf+vz*cf,vr=-vx*cf+vz*sf;
  const sp=Math.hypot(vx,vz);
  boostT=Math.max(0,boostT-dt);if(vf<(boostT>0?55:36)&&!air)vf+=(boostT>0?45:16)*dt;
  vf*=Math.exp(-(hb?.5:.12)*dt);
  const grip=(hb?.3:(Math.abs(steer)>.3&&sp>12?1.0:3.2))*(1-.3*wet);
  if(!air)vr*=Math.exp(-grip*dt);
  vx=vf*sf-vr*cf;vz=vf*cf+vr*sf;
  h-=steer*2.6*Math.min(1,sp/7)*(hb?1.6:1.15)*dt*(air?.3:1);h+=spin*dt;spin*=Math.exp(-2.2*dt);
  if(sp>8&&!air){let da=Math.atan2(vx,vz)-h;da=Math.atan2(Math.sin(da),Math.cos(da));h+=da*(hb?.9:3)*dt;}
  if(!air){const e=1.5,gx=(volH(x+e,z)-volH(x-e,z))/(2*e),gz=(volH(x,z+e)-volH(x,z-e))/(2*e);vx-=gx*22*dt;vz-=gz*22*dt;}
  x+=vx*dt;z+=vz*dt;
  for(const p of pads)if(!air&&Math.hypot(x-p.x,z-p.z)<3.2)boostT=1.1;
  for(const p of ponds)if(!air&&Math.hypot(x-p.x,z-p.z)<p.r){vx*=Math.exp(-1.2*dt);vz*=Math.exp(-1.2*dt);if(Math.random()<.5)puff(x+(Math.random()-.5)*2,z+(Math.random()-.5)*2,vx*.3,vz*.3);}
  {const gh=rampH(x,z);
   if(!air){if(gh<pgh-.3&&lvy>1){air=true;vy=lvy;}else{cy=gh;lvy=clamp((gh-pgh)/dt,-30,16);}}
   if(air){vy-=24*dt;cy+=vy*dt;if(cy<=gh){cy=gh;air=false;vy=0;lvy=0;vx*=.97;vz*=.97;}}
   pgh=gh;}
  if(!air){const lx=x-VX,lz=z-VZ,ld=Math.hypot(lx,lz);if(ld<LAVA+1){const k=ld>.1?1/ld:0;vx+=lx*k*16;vz+=lz*k*16;air=true;vy=15;rollV=(Math.random()<.5?-1:1)*(9+Math.random()*5);spin=(Math.random()-.5)*14;hit=.5;for(let q=0;q<6;q++)puff(x+(Math.random()-.5)*3,z+(Math.random()-.5)*3,vx*.2,vz*.2);}}

  // collisions
  hit=Math.max(0,hit-dt);
  for(const t of trees){
    const dx=x-t.x,dz=z-t.z,d=Math.hypot(dx,dz),m=t.r+1.1;
    if(d<m&&cy<1.2){const nx=dx/d,nz=dz/d;x=t.x+nx*m;z=t.z+nz*m;
      const dv=vx*nx+vz*nz;if(dv<0){vx-=1.6*dv*nx;vz-=1.6*dv*nz;}
      vx*=.6;vz*=.6;crash();}
  }
  const d0=Math.hypot(x,z);
  if(d0>R-2){const nx=-x/d0,nz=-z/d0;x=-nx*(R-2);z=-nz*(R-2);
    const dv=vx*nx+vz*nz;if(dv<0){vx-=1.5*dv*nx;vz-=1.5*dv*nz;}vx*=.7;vz*=.7;crash();}

  // drift scoring
  const slip=Math.abs(vr),drifting=slip>3.5&&sp>9&&!air;
  if(drifting){
    dT+=dt;gap=0;mult=1+Math.min(4,Math.floor(dT/1.2));
    cur+=slip*dt*mult*3;
    skT-=dt;if(skT<=0){skid(x,z,h);puff(x-sf*1.3-cf*.8,z-cf*1.3+sf*.8,vx,vz);puff(x-sf*1.3+cf*.8,z-cf*1.3-sf*.8,vx,vz);skT=.04;}
    combo.textContent='Drift ×'+mult+'  +'+Math.round(cur);combo.className='';msgT=0;
  }else if(cur>0){
    gap+=dt;if(gap>.7){const g=Math.round(cur);bankIt();combo.textContent='+'+g;msgT=1;}
  }
  if(msgT>0){msgT-=dt;if(msgT<=0)combo.textContent='';}
  $('sc').textContent=Math.round(bank+cur);
}

// day/night + rain
const KF=[['#4a90d9','#8cc4ef','#d8eefb',1,1.05,'#fff4c2',0],['#3d2f7a','#f08a7a','#f6b183',.85,.9,'#ffd28a',0],['#070b24','#141a45','#262a5c',.4,.2,'#dce6ff',1],['#3a3f8f','#d77f96','#f3b58f',.8,.8,'#ffd9a0',0]].map(k=>({t:new THREE.Color(k[0]),m:new THREE.Color(k[1]),h:new THREE.Color(k[2]),a:k[3],s:k[4],c:new THREE.Color(k[5]),n:k[6]}));
const tT=new THREE.Color(),tM=new THREE.Color(),tH=new THREE.Color(),gT=new THREE.Color(),gM=new THREE.Color(),gH=new THREE.Color(),grey=new THREE.Color(0x6f7787);
let clock=0,wet=0,wetT=0,wxT=20;
const RN=420,rp=new Float32Array(RN*6),rr=[];
for(let i=0;i<RN;i++)rr.push([(Math.random()-.5)*50,Math.random()*30,(Math.random()-.5)*50]);
const rg2=new THREE.BufferGeometry();rg2.setAttribute('position',new THREE.BufferAttribute(rp,3));
const rainM=new THREE.LineBasicMaterial({color:0xcfe0ff,transparent:true,opacity:0,fog:false});
const rain=new THREE.LineSegments(rg2,rainM);rain.frustumCulled=false;rain.visible=false;scene.add(rain);
function updRain(dt){if(!rain.visible)return;for(let i=0;i<RN;i++){const d=rr[i];d[1]-=38*dt;if(d[1]<0)d[1]+=30;
 const px=x+(((d[0]-x+25)%50)+50)%50-25,pz=z+(((d[2]-z+25)%50)+50)%50-25,o=i*6;
 rp[o]=px;rp[o+1]=d[1];rp[o+2]=pz;rp[o+3]=px-vx*.012;rp[o+4]=d[1]+1.1;rp[o+5]=pz-vz*.012;}
 rg2.attributes.position.needsUpdate=true;}
function updSky(dt){
 clock+=dt;let tt=(clock+8)%108,i=0;const DU=[70,10,16,12];while(tt>=DU[i]){tt-=DU[i];i++;}
 const f0=tt/DU[i],g2=i===2?clamp((f0-.5)*2,0,1):f0,f=i===0?f0*f0*f0:g2*g2*(3-2*g2),A=KF[i],B=KF[(i+1)%4];
 tT.copy(A.t).lerp(B.t,f);tM.copy(A.m).lerp(B.m,f);tH.copy(A.h).lerp(B.h,f);
 const am=A.a+(B.a-A.a)*f,sn=A.s+(B.s-A.s)*f,nt=A.n+(B.n-A.n)*f;
 wxT-=dt;if(wxT<=0){wetT=wetT>.5?0:1;wxT=22+Math.random()*25;}
 wet+=(wetT-wet)*Math.min(1,dt*.3);
 gT.copy(tT).lerp(grey,wet*.6);gM.copy(tM).lerp(grey,wet*.7);gH.copy(tH).lerp(grey,wet*.7);
 const g=skyX.createLinearGradient(0,0,0,256);
 g.addColorStop(0,'#'+gT.getHexString());g.addColorStop(.35,'#'+gM.getHexString());g.addColorStop(.55,'#'+gH.getHexString());g.addColorStop(1,'#'+gH.getHexString());
 skyX.fillStyle=g;skyX.fillRect(0,0,2,256);skyT.needsUpdate=true;
 scene.fog.color.copy(gH);scene.fog.near=45-wet*20;scene.fog.far=160-wet*60;
 hemi.intensity=am*(1-wet*.25);sun.intensity=sn*(1-wet*.6);
 sunM.material.color.copy(A.c).lerp(B.c,f);sunM.visible=wet<.8;
 stars.material.opacity=nt*(1-wet);spot.intensity=nt*2.4+wet*.6;
 rain.visible=wet>.04;rainM.opacity=wet*.55;cM.color.copy(tH).lerp(grey,wet*.8).multiplyScalar(1.2);}
let camSl=0;let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(running){step(dt);updAI(dt);updWild(dt);}updBirds(dt);
  const sp=Math.hypot(vx,vz);
  car.position.set(x,.05+cy,z);car.rotation.y=h;if(air){roll+=rollV*dt;}else{roll=Math.atan2(Math.sin(roll),Math.cos(roll));roll*=Math.max(0,1-dt*12);}car.rotation.z=roll;car.rotation.x+=(-Math.atan2(clamp(air?vy:lvy,-12,12),Math.max(sp,6))-car.rotation.x)*Math.min(1,dt*8);
  mts.position.set(x,0,z);mts.updateMatrixWorld();sunM.lookAt(cam.position);glow.lookAt(cam.position);glow.material.color.copy(sunM.material.color);glow.visible=sunM.visible;
  sun.position.set(x-40,55+cy,z+90);sun.target.position.set(x,cy,z);
  updPuffs(dt);updSky(dt);updRain(dt);updVolc(dt);
  padM.opacity=.65+.3*Math.sin(t*.008);
  for(const c of clouds){c.position.x+=dt*4;if(c.position.x>320)c.position.x-=640;}
  $('spd').style.opacity=clamp((sp-26)/16,0,1)*.8;
  body.rotation.z=steer*sp*.004;
  body.position.y=hit>0?Math.sin(t*.06)*.06:0;
  let da=h-camA;da=Math.atan2(Math.sin(da),Math.cos(da));
  camA+=da*Math.min(1,dt*2.6);
  const tx=x-Math.sin(camA)*9,tz=z-Math.cos(camA)*9;
  camSl+=((air?0:clamp(lvy/Math.max(sp,8),-.5,.5))-camSl)*Math.min(1,dt*4);
  const cyT=cy+4.8+Math.max(camSl,0)*8;
  cam.position.x+=(tx-cam.position.x)*Math.min(1,dt*6);cam.position.z+=(tz-cam.position.z)*Math.min(1,dt*6);cam.position.y+=(cyT-cam.position.y)*Math.min(1,dt*9);
  cam.position.y=Math.max(cam.position.y,volH(cam.position.x,cam.position.z)+3);
  cam.lookAt(x+Math.sin(camA)*5,cy+1+camSl*5,z+Math.cos(camA)*5);
  const fov=62+sp*.45+(boostT>0?8:0);if(Math.abs(cam.fov-fov)>.1){cam.fov+=(fov-cam.fov)*.1;cam.updateProjectionMatrix();}
  renderer.render(scene,cam);
}
requestAnimationFrame(frame);
})();

 else if(c==='coins'||c==='coinrain'){coinsTotal+=1000;$('cn').textContent=coinsTotal;try{localStorage.setItem('lpd_coins',coinsTotal)}catch(e){}msg='+1000 coins';sfx.coin();}
 else if(c==='time'||c==='daynight'){timeLock=(timeLock+1)%3;msg=['time: normal cycle','time: always day','time: always night'][timeLock];}
 else if(c==='off'){for(const k in cheat)cheat[k]=false;timeLock=0;msg='all cheats off';}

 {k:'drift',n:'Drift challenge',d:'Score {g} drift points in {t}s',g:[2500,6000,12000],t:[60,60,60]},
 {k:'animal',n:'Animal hunt',d:'Knock {g} animals in {t}s',g:[3,6,10],t:[60,60,60]},
 {k:'dash',n:'Checkpoint dash',d:'Hit {g} markers in {t}s',g:[5,8,12],t:[50,60,70]},
 {k:'smash',n:'Demolition',d:'Smash {g} trees or buildings in {t}s',g:[8,15,25],t:[45,45,45]},

function startMission(i){const d=MS[i];sfx.resume();endRace();endMission(true);
 ms.on=true;ms.k=d.k;ms.v=0;ms.tier=msTier;ms.goal=d.g[msTier];ms.t=d.t[msTier];ms.god=d.k==='smash';ms.pts=[];ms.name=d.n;
 if(d.k==='dash'){let px=x,pz=z,tr=0;while(ms.pts.length<ms.goal&&tr++<6000){const a=Math.random()*6.28,r=50+Math.random()*60,qx=px+Math.cos(a)*r,qz=pz+Math.sin(a)*r;if(Math.hypot(qx,qz)>R-40||!okPt(qx,qz))continue;ms.pts.push([qx,qz]);px=qx;pz=qz;}}
 if(d.k==='summit'){const tg=MAP===1?[PKX,PKZ]:MAP===2?[180,-150]:MAP===3?[0,0]:[VX+VRC+1,VZ];ms.pts=[tg];const sp0=MAP===3?[0,-250]:[0,0];x=sp0[0];z=sp0[1];vx=vz=0;h=Math.atan2(tg[0]-x,tg[1]-z);camA=h;cy=volH(x,z);vy=0;air=false;spin=0;roll=0;rollV=0;pgh=cy;lvy=0;}
